<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
var items=[];
function slug(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)}
function make(name,base){
  var qr=qrcode(0,"M");qr.addData(base+"/?n="+encodeURIComponent(name));qr.make();
  var n=qr.getModuleCount(),cs=10,m=4,sz=(n+2*m)*cs,c=document.createElement("canvas");
  c.width=sz;c.height=sz+70;var x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#000";
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))x.fillRect((k+m)*cs,(r+m)*cs,cs,cs);
  var fs=30;x.textAlign="center";
  do{x.font="bold "+fs+"px sans-serif";fs--}while(x.measureText(name).width>sz-20&&fs>10);
  x.fillText(name,sz/2,sz+40);
  return c;
}
document.getElementById("go").onclick=function(){
  var base=document.getElementById("base").value.trim().replace(/\/+$/,"");
  var st=document.getElementById("st"),g=document.getElementById("grid");
  if(!base){st.textContent="Écris d’abord l’adresse de ton site.";return}
  if(!/^https?:\/\//.test(base))base="https://"+base;
  var names=document.getElementById("names").value.split("\n").map(function(s){return s.trim()}).filter(Boolean);
  g.innerHTML="";items=[];
  names.forEach(function(nm,i){
    var c=make(nm,base),f=String(i+1).padStart(3,"0")+"-"+slug(nm)+".png";
    items.push({c:c,f:f});
    var d=document.createElement("div");d.className="c";
    var im=new Image();im.src=c.toDataURL("image/png");
    var a=document.createElement("a");a.href=im.src;a.download=f;a.textContent="Télécharger";
    d.appendChild(im);d.appendChild(a);g.appendChild(d);
  });
  st.textContent=names.length+" QR codes générés. Scanne-en un avec ton téléphone pour vérifier.";
  document.getElementById("zip").disabled=!names.length;
};
document.getElementById("zip").onclick=function(){
  var st=document.getElementById("st");st.textContent="Préparation du ZIP…";
  var z=new JSZip(),p=items.map(function(it){return new Promise(function(ok){
    it.c.toBlob(function(b){z.file(it.f,b);ok()},"image/png")})});
  Promise.all(p).then(function(){return z.generateAsync({type:"blob"})}).then(function(b){
    var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="QR-codes-mariage-Nicodiv.zip";a.click();
    st.textContent="ZIP téléchargé.";
  });
};

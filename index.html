<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mariage Nicodiv</title>
<style>
html{background:#0b0b0b}
body{margin:0;background:#0b0b0b;color:#f3e9d2;font-family:Georgia,"Times New Roman",serif;text-align:center}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 28px}
.hello{font-size:clamp(1.1rem,4.6vw,1.5rem);color:#d9b45a;line-height:1.35;margin:6px 0 18px;letter-spacing:.02em}
.hello b{display:block;color:#f3e9d2;font-size:1.15em;margin-top:4px;font-weight:700}
img{display:block;width:100%;height:auto;border-radius:6px}
</style></head><body>
<div class="wrap">
<div class="hello" id="hello" hidden></div>
<img src="affiche.jpg" alt="Save the date – Nico-City & Divine – vendredi 4 décembre 2026">
</div>
<script>
(function(){
  var n=(new URLSearchParams(location.search).get("n")||"").trim().slice(0,80);
  if(!n)return;
  var el=document.getElementById("hello");
  el.textContent="Mariage Nicodiv/";
  var b=document.createElement("b");b.textContent=n;el.appendChild(b);
  el.hidden=false;
  document.title="Mariage Nicodiv – "+n;
})();
</script></body></html>
